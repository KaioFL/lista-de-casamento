<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c2333"/>
      <stop offset="50%" stop-color="#681521"/>
      <stop offset="100%" stop-color="#3d0912"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="35%" stop-color="#f7d065"/>
      <stop offset="70%" stop-color="#d49b28"/>
      <stop offset="100%" stop-color="#996a12"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="35%" stop-color="#e8bc44"/>
      <stop offset="70%" stop-color="#c98a1a"/>
      <stop offset="100%" stop-color="#875608"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle gold border rim -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#f7d065" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Left Ring -->
  <circle cx="26" cy="34" r="12.5" fill="none" stroke="url(#goldGrad1)" stroke-width="4.2"/>

  <!-- Right Ring -->
  <circle cx="38" cy="32" r="12.5" fill="none" stroke="url(#goldGrad2)" stroke-width="4.2"/>

  <!-- Interlocking Front Arc -->
  <path d="M 33 23.5 A 12.5 12.5 0 0 1 38.5 34" fill="none" stroke="url(#goldGrad1)" stroke-width="4.2" stroke-linecap="round"/>

  <!-- Diamond / Sparkle on Top of Right Ring -->
  <g transform="translate(38, 19.5)" filter="url(#glow)">
    <path d="M 0,-5.5 Q 0,0 5.5,0 Q 0,0 0,5.5 Q 0,0 -5.5,0 Q 0,0 0,-5.5 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="1.2" fill="#fff9e6"/>
  </g>
  
  <!-- Secondary delicate sparkle -->
  <path d="M 18,21 Q 18,23.5 20.5,23.5 Q 18,23.5 18,26 Q 18,23.5 15.5,23.5 Q 18,23.5 18,21 Z" fill="#fff5cc" opacity="0.9"/>
</svg>
